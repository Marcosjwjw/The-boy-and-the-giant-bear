function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- Audio (sintetizado, sin archivos externos) ----------
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playAlarmSound() {
  try {
    const ac = getAudioCtx();
    const now = ac.currentTime;
    const dur = 2.4;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sawtooth';
    gain.gain.value = 0.05;
    osc.connect(gain).connect(ac.destination);
    for (let t = 0; t < dur; t += 0.5) {
      osc.frequency.setValueAtTime(680, now + t);
      osc.frequency.linearRampToValueAtTime(1020, now + t + 0.25);
      osc.frequency.linearRampToValueAtTime(680, now + t + 0.5);
    }
    osc.start(now);
    osc.stop(now + dur);
  } catch (e) {}
}
function playSwordSound() {
  try {
    const ac = getAudioCtx();
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(900, now);
    osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.connect(gain).connect(ac.destination);
    osc.start(now); osc.stop(now + 0.16);
  } catch (e) {}
}
function playHitSound() {
  try {
    const ac = getAudioCtx();
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
    gain.gain.setValueAtTime(0.16, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    osc.connect(gain).connect(ac.destination);
    osc.start(now); osc.stop(now + 0.2);
  } catch (e) {}
}
function playVictorySound() {
  try {
    const ac = getAudioCtx();
    const now = ac.currentTime;
    [523, 659, 784, 1046].forEach((f, i) => {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'triangle';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0.12, now + i*0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i*0.12 + 0.25);
      osc.connect(gain).connect(ac.destination);
      osc.start(now + i*0.12);
      osc.stop(now + i*0.12 + 0.26);
    });
  } catch (e) {}
}

// ---------- Texturas procedurales ----------
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function buildDirtTile() {
  const size = 48;
  const c = makeCanvas(size, size);
  const cx = c.getContext('2d');
  const g = cx.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0, '#8a5a34');
  g.addColorStop(1, '#5c3a1e');
  cx.fillStyle = g;
  cx.fillRect(0, 0, size, size);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = Math.random() * 2 + 0.5;
    cx.fillStyle = Math.random() > 0.5
      ? 'rgba(0,0,0,' + (Math.random() * 0.25) + ')'
      : 'rgba(255,220,180,' + (Math.random() * 0.18) + ')';
    cx.beginPath();
    cx.arc(x, y, r, 0, Math.PI * 2);
    cx.fill();
  }
  for (let i = 0; i < 8; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    cx.fillStyle = 'rgba(90,70,55,0.6)';
    cx.beginPath();
    cx.ellipse(x, y, 3, 2, Math.random() * Math.PI, 0, Math.PI * 2);
    cx.fill();
  }
  return c;
}
function buildGrassTile() {
  const w = 48, h = 16;
  const c = makeCanvas(w, h);
  const cx = c.getContext('2d');
  const g = cx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#6fd94f');
  g.addColorStop(1, '#3d9a34');
  cx.fillStyle = g;
  cx.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * w;
    const bh = Math.random() * 6 + 3;
    cx.strokeStyle = 'rgba(20,90,20,' + (0.35 + Math.random() * 0.3) + ')';
    cx.lineWidth = 1;
    cx.beginPath();
    cx.moveTo(x, h * 0.55);
    cx.lineTo(x + (Math.random() * 2 - 1), h * 0.55 - bh);
    cx.stroke();
  }
  for (let i = 0; i < 12; i++) {
    const x = Math.random() * w;
    cx.strokeStyle = 'rgba(210,255,180,0.4)';
    cx.beginPath();
    cx.moveTo(x, h * 0.5);
    cx.lineTo(x, h * 0.5 - (Math.random() * 4 + 2));
    cx.stroke();
  }
  return c;
}
function buildCloudSprite(size) {
  const c = makeCanvas(size, size * 0.6);
  const cx = c.getContext('2d');
  const puffs = [[0.5,0.55,0.34],[0.28,0.62,0.24],[0.72,0.62,0.24],[0.4,0.4,0.24],[0.62,0.4,0.22]];
  puffs.forEach(([px,py,pr]) => {
    const g = cx.createRadialGradient(size*px, size*0.6*py, 2, size*px, size*0.6*py, size*pr);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.fillStyle = g;
    cx.beginPath();
    cx.arc(size*px, size*0.6*py, size*pr, 0, Math.PI*2);
    cx.fill();
  });
  return c;
}

  if (['ArrowRight','d','D'].includes(e.key)) keys['right'] = true;
  if (['ArrowUp','w','W',' '].includes(e.key)) { keys['jump'] = true; e.preventDefault(); }
  if (['z','Z'].includes(e.key) && !keys['attack']) { keys['attack'] = true; tryAttack(); }
});
window.addEventListener('keyup', e => {
  if (['ArrowLeft','a','A'].includes(e.key)) keys['left'] = false;
  if (['ArrowRight','d','D'].includes(e.key)) keys['right'] = false;
  if (['ArrowUp','w','W',' '].includes(e.key)) keys['jump'] = false;
  if (['z','Z'].includes(e.key)) keys['attack'] = false;
});
function bindHoldButton(id, key) {
  const btn = document.getElementById(id);
  const start = ev => { ev.preventDefault(); keys[key] = true; };
  const end = ev => { ev.preventDefault(); keys[key] = false; };
  btn.addEventListener('touchstart', start);
  btn.addEventListener('touchend', end);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
}
bindHoldButton('btnLeft', 'left');
bindHoldButton('btnRight', 'right');
bindHoldButton('btnJump', 'jump');
document.getElementById('btnAttack').addEventListener('touchstart', ev => { ev.preventDefault(); tryAttack(); });
document.getElementById('btnAttack').addEventListener('mousedown', ev => { ev.preventDefault(); tryAttack(); });
document.getElementById('restartBtn').addEventListener('click', resetGame);

function tryAttack() {
  if (gameOver || paused || playerFrozen) return;
  if (player.attackCooldown <= 0) {
    player.attackTimer = 14;
    player.attackCooldown = 32;
    player.hitRegistered = false;
    playSwordSound();
  }
}

// ---------- Lógica principal ----------
function update() {
  if (gameOver || paused) return;

  if (player.attackCooldown > 0) player.attackCooldown--;
  if (player.attackTimer > 0) player.attackTimer--;

  if (!playerFrozen) {
    if (keys['left'])  { player.vx -= MOVE_SPEED * 0.35; player.facing = -1; }
    if (keys['right']) { player.vx += MOVE_SPEED * 0.35; player.facing = 1; }
    player.vx *= FRICTION;
    if (Math.abs(player.vx) > MOVE_SPEED) player.vx = MOVE_SPEED * Math.sign(player.vx);

    if (keys['jump'] && player.onGround) {
      player.vy = JUMP_FORCE;
      player.onGround = false;
    }
  } else {
    player.vx *= FRICTION;
  }

  player.vy += GRAVITY;
  if (player.vy > 15) player.vy = 15;

  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      const prevBottom = player.y + player.h - player.vy;
      if (prevBottom <= p.y + 1 && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0 && player.y - player.vy >= p.y + p.h - 1) {
        player.y = p.y + p.h;
        player.vy = 0;
      } else {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }
  }

  if (player.x < 0) player.x = 0;
  if (player.x + player.w > worldWidth) player.x = worldWidth - player.w;

  camera.x = Math.max(0, Math.min(player.x - W/2, worldWidth - W));

  // hitbox de espada
  if (player.attackTimer > 0) {
    const range = 34;
    const hb = player.facing === 1
      ? {x: player.x + player.w - 4, y: player.y + 4, w: range, h: player.h - 8}
      : {x: player.x - range + 4, y: player.y + 4, w: range, h: player.h - 8};

    if (!player.hitRegistered && boss && bossPhase === 'fight' && boss.invulnTimer <= 0 && rectsOverlap(hb, boss)) {
      boss.health--;
      boss.invulnTimer = 40;
      player.hitRegistered = true;
      playHitSound();
      if (boss.health <= 0) {
        bossPhase = 'defeated';
        bossDefeatTimer = 110;
        playVictorySound();
      }
    }

    if (miniBears.length) {
      miniBears = miniBears.filter(b => {
        if (rectsOverlap(hb, b)) { playHitSound(); return false; }
        return true;
      });
    }
  }

  if (freeWorldActive) {
    updateFreeWorld();
    return;
  }

  const lvl = levels[levelIndex];
  if (lvl && lvl.isBoss) {
    updateBoss();
    return;
  }

  if (player.y > H + 60) { loseLife(); return; }

  for (const e of enemiesArr) {
    e.x += e.speed * e.dir;
    if (e.x < e.minX || e.x + e.w > e.maxX) e.dir *= -1;
    if (rectsOverlap(player, e)) {
      const playerBottom = player.y + player.h;
      if (player.vy > 0 && playerBottom - e.y < 18) {
        enemiesArr = enemiesArr.filter(en => en !== e);
        player.vy = JUMP_FORCE * 0.6;
      } else {
        loseLife();
        return;
      }
    }
  }

  for (const c of coinsArr) {
    if (!c.taken) {
      const dx = (player.x + player.w/2) - c.x;
      const dy = (player.y + player.h/2) - c.y;
      if (Math.sqrt(dx*dx + dy*dy) < 26) {
        c.taken = true;
        totalCoinsCollected++;
        document.getElementById('coins').textContent = coinsArr.filter(x=>x.taken).length;
      }
    }
  }

  if (goal && rectsOverlap(player, goal)) {
    if (levelIndex < levels.length - 1) {
      levelIndex++;
      loadLevel(levelIndex);
    } else {
      win = true;
      gameOver = true;
      document.getElementById('msg').textContent = '🎉 ¡Ganaste el juego! Monedas totales: ' + totalCoinsCollected;
      document.getElementById('restartBtn').style.display = 'inline-block';
    }
  }
}

function updateBoss() {
  if (bossPhase === 'alarm') {
    alarmTimer--;
    if (alarmTimer <= 0) {
      bossPhase = 'entrance';
    }
    return;
  }
  if (bossPhase === 'entrance') {
    boss.x -= 6;
    if (boss.x <= boss.targetX) {
      boss.x = boss.targetX;
      bossPhase = 'fight';
      playerFrozen = false;
    }
    return;
  }
  if (bossPhase === 'fight') {
    if (boss.invulnTimer > 0) boss.invulnTimer--;

    if (boss.state === 'patrol') {
      boss.x += boss.speed * boss.dir;
      if (boss.x < boss.minX || boss.x + boss.w > boss.maxX) boss.dir *= -1;
      boss.attackCooldown--;
      if (boss.attackCooldown <= 0) {
        boss.state = Math.random() < 0.5 ? 'telegraph_charge' : 'telegraph_summon';
        boss.stateTimer = 45;
      }
    } else if (boss.state === 'telegraph_charge' || boss.state === 'telegraph_summon') {
      boss.stateTimer--;
      boss.x += Math.sin(boss.stateTimer * 0.9) * 1.4;
      if (boss.stateTimer <= 0) {
        if (boss.state === 'telegraph_charge') {
          boss.chargeDir = player.x < boss.x ? -1 : 1;
          boss.state = 'charging';
          boss.stateTimer = 45;
        } else {
          spawnMiniBears();
          boss.state = 'patrol';
          boss.attackCooldown = 210 + Math.floor(Math.random()*80);
        }
      }
    } else if (boss.state === 'charging') {
      boss.x += 9 * boss.chargeDir;
      const minB = 20, maxB = worldWidth - boss.w - 20;
      if (boss.x < minB) { boss.x = minB; boss.stateTimer = 0; }
      if (boss.x > maxB) { boss.x = maxB; boss.stateTimer = 0; }
      boss.stateTimer--;
      if (boss.stateTimer <= 0) {
        boss.state = 'patrol';
        boss.attackCooldown = 210 + Math.floor(Math.random()*80);
      }
    }

    updateMiniBears();

    if (rectsOverlap(player, boss)) {
      loseLife();
    }
    return;
  }
  if (bossPhase === 'defeated') {
    updateMiniBears();
    bossDefeatTimer--;
    if (bossDefeatTimer <= 0) {
      startFreeWorld();
    }
    return;
  }
}

function spawnMiniBears() {
  const startX = boss.x + boss.w/2 - 15;
  const startY = boss.y + boss.h - 30;
  const towardPlayer = player.x < boss.x ? -1 : 1;
  const speeds = [-4.5, towardPlayer * 3, 4.5];
  speeds.forEach(vx => {
    miniBears.push({
      x: startX, y: startY, w: 28, h: 24,
      vx, vy: -9,
      life: 260,
      grounded: false
    });
  });
}

function updateMiniBears() {
  for (let i = miniBears.length - 1; i >= 0; i--) {
    const b = miniBears[i];
    b.vy += GRAVITY;
    b.x += b.vx;
    b.y += b.vy;
    const groundY = 410 - b.h;
    if (b.y >= groundY) {
      b.y = groundY;
      if (!b.grounded) { b.vy = -5; b.grounded = true; }
      else b.vy = 0;
    }
    b.life--;
    if (b.life <= 0 || b.x < -60 || b.x > worldWidth + 60) {
      miniBears.splice(i, 1);
      continue;
    }
    if (rectsOverlap(player, b)) {
      loseLife();
      return;
    }
  }
}

function updateFreeWorld() {
  for (const e of decorEnemies) {
    e.x += e.speed * e.dir;
    if (e.x < e.minX || e.x + e.w > e.maxX) e.dir *= -1;
  }
  for (const c of coinsArr) {
    if (!c.taken) {
      const dx = (player.x + player.w/2) - c.x;
      const dy = (player.y + player.h/2) - c.y;
      if (Math.sqrt(dx*dx + dy*dy) < 26) {
        c.taken = true;
        document.getElementById('coins').textContent = coinsArr.filter(x=>x.taken).length;
      }
    }
  }
  if (player.y > H + 100) {
    player.x = freeWorld.spawn.x;
    player.y = freeWorld.spawn.y;
    player.vy = 0;
  }
}

function loseLife() {
  lives--;
  document.getElementById('lives').textContent = lives;
  if (lives <= 0) {
    gameOver = true;
    document.getElementById('msg').textContent = '💀 Game Over - Te quedaste sin vidas';
    document.getElementById('restartBtn').style.display = 'inline-block';
  } else {
    loadLevel(levelIndex);
  }
}

// ---------- Dibujo ----------
function draw() {
  ctx.clearRect(0,0,W,H);

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#5b9bd5');
  grad.addColorStop(0.55, '#a8d8f0');
  grad.addColorStop(1, '#dff2ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  const sunG = ctx.createRadialGradient(720,60,4,720,60,70);
  sunG.addColorStop(0, 'rgba(255,250,200,1)');
  sunG.addColorStop(0.4, 'rgba(255,240,150,0.55)');
  sunG.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = sunG;
  ctx.fillRect(650,0,150,140);

  const camX = camera.x;
  ctx.fillStyle = '#7fa6c9';
  drawMountainRow(H-40, 90, 0.55, camX*0.2);
  ctx.fillStyle = '#5f89ae';
  drawMountainRow(H-40, 130, 0.75, 40 + camX*0.35);

  cloudPositions.forEach(([x,y,scale]) => {
    const w = cloudSprite.width * scale, h = cloudSprite.height * scale;
    ctx.drawImage(cloudSprite, x - w/2 - camX*0.1, y - h/2, w, h);
  });

  // plataformas
  platforms.forEach(p => {
    const px = p.x - camX;
    if (px + p.w < 0 || px > W) return;
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(px+4, p.y+p.h, p.w, 6);
    ctx.save();
    ctx.translate(px, p.y);
    ctx.fillStyle = dirtPattern;
    ctx.fillRect(0, 8, p.w, p.h-8);
    ctx.fillStyle = grassPattern;
    ctx.fillRect(0, 0, p.w, 10);
    ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(px, p.y, p.w, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(px, p.y+p.h-3, p.w, 3);
  });

  // monedas
  coinsArr.forEach(c => {
    if (!c.taken) {
      const cx1 = c.x - camX;
      const bob = Math.sin(Date.now()/300 + c.x) * 2;
      const cy = c.y + bob;
      const cg = ctx.createRadialGradient(cx1-2, cy-2, 1, cx1, cy, c.r+2);
      cg.addColorStop(0, '#fff6c9');
      cg.addColorStop(0.5, '#ffd700');
      cg.addColorStop(1, '#b8860b');
      ctx.beginPath();
      ctx.arc(cx1, cy, c.r, 0, Math.PI*2);
      ctx.fillStyle = cg;
      ctx.fill();
      ctx.strokeStyle = '#8a6400';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx1, cy, c.r-3, -0.4, 1.1);
      ctx.stroke();
    }
  });

  // bandera de meta
  if (goal) {
    const gx = goal.x - camX;
    const poleG = ctx.createLinearGradient(gx, 0, gx+6, 0);
    poleG.addColorStop(0, '#5a3616');
    poleG.addColorStop(1, '#8b5a2b');
    ctx.fillStyle = poleG;
    ctx.fillRect(gx, goal.y, 6, goal.h);
    const flagG = ctx.createLinearGradient(gx, goal.y, gx+40, goal.y+24);
    flagG.addColorStop(0, '#ff6b5b');
    flagG.addColorStop(1, '#d6291a');
    ctx.fillStyle = flagG;
    ctx.beginPath();
    ctx.moveTo(gx+6, goal.y);
    ctx.lineTo(gx+40, goal.y+12);
    ctx.lineTo(gx+6, goal.y+24);
    ctx.closePath();
    ctx.fill();
  }

  // enemigos normales
  enemiesArr.forEach(e => {
    if (e.type === 'mushroom') drawMushroom(e, camX);
    else drawBlob(e, camX);
  });
  decorEnemies.forEach(e => drawMushroom(e, camX));

  drawPlayer(camX);

  miniBears.forEach(b => drawMiniBear(b, camX));
  if (boss) drawBoss(camX);

  drawAlarmOverlay();
  drawBossHealthBar();
}

function drawMountainRow(baseY, height, opacity, offset) {
  ctx.save();
  ctx.globalAlpha = opacity;
  const off = offset || 0;
  ctx.beginPath();
  ctx.moveTo(-20, baseY);
  for (let x = -20; x <= W+20; x += 80) {
    const peak = baseY - height * (0.5 + 0.5*Math.sin((x+off)*0.015));
    ctx.lineTo(x+40, peak);
    ctx.lineTo(x+80, baseY);
  }
  ctx.lineTo(W+20, baseY);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBlob(e, camX) {
  const cx0 = e.x + e.w/2 - camX, cy0 = e.y + e.h/2;
  const eg = ctx.createRadialGradient(cx0-4, cy0-4, 2, cx0, cy0, e.w/1.6);
  eg.addColorStop(0, '#e8654f');
  eg.addColorStop(0.6, '#c0392b');
  eg.addColorStop(1, '#8a2318');
  ctx.beginPath();
  ctx.ellipse(cx0, cy0, e.w/2, e.h/2, 0, 0, Math.PI*2);
  ctx.fillStyle = eg;
  ctx.fill();
  ctx.fillStyle = 'rgba(60,10,5,0.35)';
  ctx.beginPath();
  ctx.ellipse(cx0-8, cy0+4, 4, 2.5, 0.4, 0, Math.PI*2);
  ctx.ellipse(cx0+7, cy0+3, 3, 2, -0.3, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx0-6, cy0-4, 4, 0, Math.PI*2);
  ctx.arc(cx0+6, cy0-4, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx0-6+e.dir, cy0-4, 2, 0, Math.PI*2);
  ctx.arc(cx0+6+e.dir, cy0-4, 2, 0, Math.PI*2);
  ctx.fill();
}

function drawMushroom(e, camX) {
  const x = e.x - camX, y = e.y;
  const capW = e.w, capH = e.h*0.58, stemW = e.w*0.5, stemH = e.h*0.45;
  ctx.fillStyle = '#f2e3c6';
  ctx.fillRect(x+(capW-stemW)/2, y+capH-2, stemW, stemH+2);
  const cg = ctx.createRadialGradient(x+capW/2-4, y+4, 2, x+capW/2, y+capH/2, capW/1.3);
  cg.addColorStop(0, '#ff8f7a');
  cg.addColorStop(0.6, '#e2402a');
  cg.addColorStop(1, '#a8241b');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(x+capW/2, y+capH*0.55, capW/2, capH*0.62, 0, Math.PI, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  [[0.25,0.3,3.2],[0.55,0.16,2.8],[0.75,0.32,3],[0.4,0.42,2.3]].forEach(([px,py,r]) => {
    ctx.beginPath();
    ctx.arc(x+capW*px, y+capH*py, r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x+capW/2-5, y+capH+stemH*0.3, 1.8, 0, Math.PI*2);
  ctx.arc(x+capW/2+5, y+capH+stemH*0.3, 1.8, 0, Math.PI*2);
  ctx.fill();
}

function drawBoss(camX) {
  const bx = boss.x - camX;
  let by = boss.y;
  let alpha = 1;
  if (bossPhase === 'defeated') {
    const p = 1 - Math.max(0, bossDefeatTimer) / 110;
    by += p * 30;
    alpha = Math.max(0, 1 - p);
  }
  const flash = boss.invulnTimer > 0 && Math.floor(boss.invulnTimer/4)%2===0;
  const warning = boss.state === 'telegraph_charge' || boss.state === 'telegraph_summon';

  ctx.save();
  ctx.globalAlpha = alpha;

  if (warning) {
    const wg = ctx.createRadialGradient(bx+boss.w/2, by+boss.h/2, 10, bx+boss.w/2, by+boss.h/2, boss.w*0.9);
    wg.addColorStop(0, 'rgba(255,60,40,0.45)');
    wg.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.arc(bx+boss.w/2, by+boss.h/2, boss.w*0.9, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(bx+boss.w/2, boss.y+boss.h+6, boss.w/2, 10, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = flash ? '#eeeeee' : '#5c3b24';
  ctx.beginPath();
  ctx.arc(bx+boss.w*0.22, by+8, 18, 0, Math.PI*2);
  ctx.arc(bx+boss.w*0.78, by+8, 18, 0, Math.PI*2);
  ctx.fill();

  const bg = ctx.createRadialGradient(bx+boss.w/2-20, by+20, 10, bx+boss.w/2, by+boss.h/2, boss.w/1.2);
  if (flash) {
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(1, '#dddddd');
  } else {
    bg.addColorStop(0, '#8a5a3c');
    bg.addColorStop(0.6, '#5c3b24');
    bg.addColorStop(1, '#3a2314');
  }
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(bx+boss.w/2, by+boss.h/2+8, boss.w/2, boss.h/2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#d9c2a3';
  ctx.beginPath();
  ctx.ellipse(bx+boss.w/2, by+boss.h*0.62, 24, 17, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2a1a10';
  ctx.beginPath();
  ctx.ellipse(bx+boss.w/2, by+boss.h*0.6, 6, 4.5, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(bx+boss.w*0.36, by+boss.h*0.4, 5.5, 0, Math.PI*2);
  ctx.arc(bx+boss.w*0.64, by+boss.h*0.4, 5.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(bx+boss.w*0.36-1.5, by+boss.h*0.4-1.5, 1.5, 0, Math.PI*2);
  ctx.arc(bx+boss.w*0.64-1.5, by+boss.h*0.4-1.5, 1.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#3a2314';
  ctx.fillRect(bx+10, by+boss.h-16, 24, 16);
  ctx.fillRect(bx+boss.w-34, by+boss.h-16, 24, 16);
  ctx.fillStyle = '#e8e2d8';
  for (let i=0;i<3;i++) {
    ctx.fillRect(bx+12+i*7, by+boss.h-4, 4, 5);
    ctx.fillRect(bx+boss.w-32+i*7, by+boss.h-4, 4, 5);
  }

  ctx.restore();
}

function drawMiniBear(b, camX) {
  const bx = b.x - camX, by = b.y;
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(bx+b.w/2, 409, b.w/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const g = ctx.createRadialGradient(bx+b.w/2-4, by+4, 2, bx+b.w/2, by+b.h/2, b.w/1.2);
  g.addColorStop(0, '#8a5a3c');
  g.addColorStop(0.6, '#5c3b24');
  g.addColorStop(1, '#3a2314');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(bx+b.w/2, by+b.h/2, b.w/2, b.h/2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#5c3b24';
  ctx.beginPath();
  ctx.arc(bx+b.w*0.25, by+3, 6, 0, Math.PI*2);
  ctx.arc(bx+b.w*0.75, by+3, 6, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#d9c2a3';
  ctx.beginPath();
  ctx.ellipse(bx+b.w/2, by+b.h*0.65, 8, 6, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(bx+b.w*0.32, by+b.h*0.42, 2.2, 0, Math.PI*2);
  ctx.arc(bx+b.w*0.68, by+b.h*0.42, 2.2, 0, Math.PI*2);
  ctx.fill();
}

function drawAlarmOverlay() {
  if (bossPhase !== 'alarm') return;
  const flash = Math.floor(alarmTimer/8)%2===0;
  ctx.fillStyle = flash ? 'rgba(255,0,0,0.3)' : 'rgba(255,0,0,0.06)';
  ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('⚠ ¡JEFE FINAL! ⚠', W/2, H/2-10);
  ctx.font = '16px sans-serif';
  ctx.fillText('Un oso enorme se acerca... prepará tu espada (Z)', W/2, H/2+22);
  ctx.restore();
}

function drawBossHealthBar() {
  if (!boss || bossPhase === 'alarm' || bossPhase === 'entrance') return;
  const barW = 300, barH = 22, x = (W-barW)/2, y = 16;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(x-4, y-4, barW+8, barH+8);
  const pct = Math.max(0, boss.health) / boss.maxHealth;
  const hg = ctx.createLinearGradient(x, 0, x+barW, 0);
  hg.addColorStop(0, '#ff5b3d');
  hg.addColorStop(1, '#ffb03d');
  ctx.fillStyle = hg;
  ctx.fillRect(x, y, barW*pct, barH);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(x, y, barW, barH);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText(bossPhase === 'defeated' ? '¡OSO DERROTADO!' : 'OSO JEFE', W/2, y+barH+16);
  ctx.restore();
}

function drawPlayer(camX) {
  const p = player;
  const px = p.x - camX;

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(px+p.w/2, p.y+p.h+3, p.w/2, 4, 0, 0, Math.PI*2);
  ctx.fill();

  const pantsG = ctx.createLinearGradient(px, p.y+28, px, p.y+p.h);
  pantsG.addColorStop(0, '#3b4a63');
  pantsG.addColorStop(1, '#232d3f');
  ctx.fillStyle = pantsG;
  ctx.fillRect(px+3, p.y+28, p.w-6, p.h-32);

  ctx.fillStyle = '#3d2b1f';
  ctx.fillRect(px+2, p.y+p.h-5, 12, 5);
  ctx.fillRect(px+p.w-14, p.y+p.h-5, 12, 5);

  const shirtG = ctx.createLinearGradient(px, p.y+14, px+p.w, p.y+30);
  shirtG.addColorStop(0, '#3d7bff');
  shirtG.addColorStop(0.5, '#2266ee');
  shirtG.addColorStop(1, '#164ec2');
  ctx.fillStyle = shirtG;
  ctx.fillRect(px, p.y+14, p.w, 18);
  ctx.strokeStyle = 'rgba(0,0,0,0.15)';
  ctx.lineWidth = 1;
  for (let i=0;i<3;i++) {
    ctx.beginPath();
    ctx.moveTo(px+6+i*8, p.y+15);
    ctx.lineTo(px+4+i*8, p.y+30);
    ctx.stroke();
  }

  const skinG = ctx.createRadialGradient(px+p.w/2-4, p.y+7, 2, px+p.w/2, p.y+9, 14);
  skinG.addColorStop(0, '#ffe9cf');
  skinG.addColorStop(1, '#e8b98a');
  ctx.fillStyle = skinG;
  ctx.fillRect(px+4, p.y+2, p.w-8, 14);

  ctx.fillStyle = '#4a3320';
  ctx.fillRect(px+3, p.y, p.w-6, 5);
  ctx.fillRect(px+3, p.y, 4, 8);
  ctx.fillRect(px+p.w-7, p.y, 4, 8);

  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  if (p.facing === 1) ctx.fillRect(px, p.y+2, 4, p.h-2);
  else ctx.fillRect(px+p.w-4, p.y+2, 4, p.h-2);

  ctx.fillStyle = '#000';
  const eyeX = p.facing === 1 ? px+p.w-10 : px+6;
  ctx.fillRect(eyeX, p.y+7, 4, 4);

  // espada envainada (siempre visible en la cintura)
  ctx.fillStyle = '#9aa5ad';
  if (p.facing === 1) ctx.fillRect(px-2, p.y+22, 5, 16);
  else ctx.fillRect(px+p.w-3, p.y+22, 5, 16);

  // espadazo activo
  if (p.attackTimer > 0) {
    const progress = 1 - p.attackTimer/14;
    const swing = (-0.9 + progress*1.8) * (p.facing === 1 ? 1 : -1);
    const originX = p.facing === 1 ? px+p.w-4 : px+4;
    const originY = p.y+18;
    ctx.save();
    ctx.translate(originX, originY);
    ctx.rotate(swing);
    const bladeLen = p.facing === 1 ? 36 : -36;
    const bladeG = ctx.createLinearGradient(0,0,bladeLen,0);
    bladeG.addColorStop(0, '#eef2f5');
    bladeG.addColorStop(1, '#c7d2d8');
    ctx.fillStyle = bladeG;
    ctx.fillRect(0, -3, bladeLen, 6);
    ctx.fillStyle = '#7a5230';
    ctx.fillRect(p.facing===1?-6:0, -5, 6, 10);
    ctx.restore();
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>

</html>
